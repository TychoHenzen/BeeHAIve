<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeeHAIve agent stations</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11131a; color: #e8e9ef; }
      body { margin: 0; padding: 24px; }
      main { max-width: 1180px; margin: auto; }
      header, .toolbar, .station-grid, .issue-list { display: grid; gap: 12px; }
      header { grid-template-columns: 1fr auto; align-items: end; }
      h1, h2, p { margin: 0; }
      p, .muted { color: #a8acbc; }
      .toolbar { grid-template-columns: minmax(220px, 1fr) auto; margin: 24px 0; }
      input, button { min-height: 36px; border: 1px solid #3b4051; border-radius: 7px; background: #1c202a; color: inherit; padding: 0 10px; }
      button { cursor: pointer; }
      button:hover, button:focus-visible { border-color: #9a8cff; }
      .station-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .station { min-height: 150px; padding: 14px; border: 1px solid #303544; border-radius: 10px; background: #191c25; }
      .station svg { width: 100%; height: 75px; }
      .station circle { fill: #9a8cff; }
      .station[data-active="0"] circle { fill: #4d5365; }
      .agent, .issue { padding: 14px; border: 1px solid #303544; border-radius: 10px; background: #191c25; }
      .agent-list, .issue-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
      .agent strong, .issue strong { display: block; margin-bottom: 6px; }
      .agent p, .issue p { margin: 4px 0; font-size: .9rem; }
      .updates { margin: 10px 0 0; padding-left: 18px; color: #a8acbc; font-size: .8rem; }
      .issue[data-visible="false"] { opacity: .62; }
      .issue-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .status { min-height: 24px; color: #a8acbc; }
      .status.error { color: #ff9b9b; }
      @media (max-width: 800px) { .station-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { grid-template-columns: 1fr; } }
      @media (max-width: 480px) { .station-grid { grid-template-columns: 1fr; } body { padding: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Agent stations</h1><p>State-derived movement, bounded estimates, and durable operator issues.</p></div>
        <a href="/dashboard">Mission control</a>
      </header>
      <section class="toolbar" aria-label="Station controls">
        <input id="project" placeholder="owner:123" autocomplete="off" aria-label="Project ID">
        <button id="refresh" type="button">Refresh</button>
      </section>
      <p id="status" class="status" role="status" aria-live="polite">Choose a project to load stations.</p>
      <section id="stations" class="station-grid" aria-label="Agent stations"></section>
      <h2>Active agents</h2>
      <section id="agents" class="agent-list" aria-label="Active agents"></section>
      <h2>Station issues</h2>
      <section id="issues" class="issue-list" aria-label="Station issues"></section>
    </main>
    <script type="module" src="/agent-stations.js"></script>
  </body>
</html>
