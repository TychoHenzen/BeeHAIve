<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeeHAIve</title>
    <link rel="stylesheet" href="/web/styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>BeeHAIve</h1>
      <span class="subtitle">Claude Code sessions on this machine</span>
      <label class="toggle"><input type="checkbox" id="show-idle" checked> Show idle sessions</label>
      <span id="refresh-state" class="muted" role="status"></span>
    </header>
    <main class="layout">
      <section class="sessions" aria-label="Sessions">
        <ul id="session-list" class="session-list"></ul>
        <p id="session-empty" class="muted" hidden>No sessions were active in the lookback window.</p>
      </section>
      <section id="detail" class="detail" aria-label="Session detail">
        <p class="muted">Pick a session to see its agents and steps.</p>
      </section>
    </main>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
