[project]
name = "beehaiive"
version = "0.1.0"
description = "A small FastAPI application."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pyright==1.1.410",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["main.py", "beehaiive", "scripts/dashboard_smoke.py"]
typeCheckingMode = "strict"
