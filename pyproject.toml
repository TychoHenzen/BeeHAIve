[project]
name = "beehaiive"
version = "0.1.0"
description = "A small FastAPI application."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.52.4",
]

[project.scripts]
beehaiive = "beehaiive.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Tests run under full strict. The only relaxation is reportPrivateUsage in tests/, because the tests deliberately exercise module-internal helpers.
[tool.pyright]
include = ["beehaiive", "tests"]
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"
