version: 2
updates:
  # uv, not pip: the pip ecosystem bumps pyproject.toml pins but never
  # uv.lock, so every bump failed `uv sync --locked` in CI.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR for all actions: codeql-action init and analyze must share a
    # version, and separate PRs each fail on the mismatch.
    groups:
      actions:
        patterns:
          - "*"
